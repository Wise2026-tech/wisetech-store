<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    WISETECH Admin
</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #070b12;

    color: white;
}


header {

    position: sticky;

    top: 0;

    z-index: 100;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    padding: 20px 5%;

    background: #050505;

    border-bottom:
        1px solid #222;
}


header h1 {

    margin: 0;

    font-size: 23px;
}


header span {

    color: #ffd000;
}


button {

    border: 0;

    border-radius: 8px;

    cursor: pointer;

    font-weight: 800;
}


.refresh {

    padding: 11px 18px;

    background: #ffd000;

    color: #111;
}


main {

    max-width: 1500px;

    margin: auto;

    padding: 35px 5%;
}


/* ================= STATS ================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0, 1fr)
        );

    gap: 15px;

    margin-bottom: 30px;
}


.stat {

    padding: 20px;

    border:
        1px solid #263248;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #121a28,
            #080d14
        );
}


.stat small {

    display: block;

    color: #91a0b5;

    margin-bottom: 8px;
}


.stat strong {

    font-size: 25px;

    color: #ffd000;
}


.profit strong {

    color: #43e39a;
}


/* ================= FILTER ================= */

.toolbar {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 20px;
}


input,
select {

    padding: 11px;

    border-radius: 8px;

    border:
        1px solid #2b394e;

    background: #0b111c;

    color: white;
}


#search {

    flex: 1;

    min-width: 230px;
}


/* ================= ORDERS ================= */

.orders {

    display: grid;

    gap: 16px;
}


.order {

    padding: 21px;

    border:
        1px solid #263248;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            #101823,
            #090e16
        );
}


.top {

    display: flex;

    justify-content:
        space-between;

    gap: 15px;

    margin-bottom: 17px;
}


.number {

    color: #ffd000;

    font-weight: 900;

    font-size: 12px;
}


.product {

    margin-top: 6px;

    font-size: 18px;

    font-weight: 800;
}


.amount {

    color: #ffd000;

    font-size: 21px;

    font-weight: 900;
}


/* ================= CUSTOMER ================= */

.customer {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0, 1fr)
        );

    gap: 15px;

    padding: 15px 0;

    border-top:
        1px solid #202c3e;
}


.customer small,
.finance small {

    display: block;

    color: #8290a5;

    margin-bottom: 5px;
}


.customer strong {

    font-size: 13px;

    word-break: break-word;
}


/* ================= FINANCE ================= */

.finance {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0, 1fr)
        );

    gap: 12px;

    padding: 15px;

    margin-top: 10px;

    border-radius: 10px;

    background: #070c13;
}


.finance strong {

    font-size: 15px;
}


.net-profit {

    color: #43e39a;
}


.unknown {

    color: #ffcf40;
}


/* ================= SUPPLIER COST ================= */

.cost-editor {

    display: flex;

    gap: 7px;

    margin-top: 8px;
}


.cost-editor input {

    width: 120px;
}


.save-cost {

    padding: 9px 12px;

    background: #ffd000;

    color: #111;
}


/* ================= STATUS ================= */

.status-row {

    display: flex;

    justify-content:
        space-between;

    gap: 15px;

    align-items: center;

    flex-wrap: wrap;

    margin-top: 17px;
}


.badges {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}


.badge {

    padding: 7px 10px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: 900;

    text-transform: uppercase;
}


.paid,
.completed {

    background:
        rgba(
            40,
            220,
            140,
            .15
        );

    color: #43e39a;
}


.pending {

    background:
        rgba(
            255,
            208,
            0,
            .15
        );

    color: #ffd000;
}


.processing {

    background:
        rgba(
            60,
            150,
            255,
            .16
        );

    color: #68b5ff;
}


.cancelled {

    background:
        rgba(
            255,
            60,
            60,
            .15
        );

    color: #ff7272;
}


/* ================= ACTIONS ================= */

.actions {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}


.actions button {

    padding: 8px 10px;

    font-size: 10px;
}


.pending-btn {

    background: #ffd000;

    color: #111;
}


.processing-btn {

    background: #278cff;

    color: white;
}


.complete-btn {

    background: #27d17f;

    color: #07120d;
}


.cancel-btn {

    background: #df3947;

    color: white;
}


.actions button:disabled {

    opacity: .35;

    cursor: not-allowed;
}


.reference {

    margin-top: 12px;

    color: #77869b;

    font-size: 10px;

    word-break: break-all;
}


.empty {

    padding: 50px;

    text-align: center;

    color: #8997aa;
}


/* ================= MOBILE ================= */

@media (max-width: 900px) {

    .stats {

        grid-template-columns:
            repeat(2, 1fr);
    }


    .customer,
    .finance {

        grid-template-columns:
            repeat(2, 1fr);
    }
}


@media (max-width: 600px) {

    header {

        padding: 17px 15px;
    }


    main {

        padding: 25px 14px;
    }


    .stats {

        gap: 9px;
    }


    .stat {

        padding: 15px;
    }


    .stat strong {

        font-size: 19px;
    }


    .top {

        flex-direction: column;
    }


    .customer,
    .finance {

        grid-template-columns: 1fr;
    }


    .actions {

        width: 100%;
    }


    .actions button {

        flex: 1;
    }
}

</style>

</head>


<body>


<header>

<h1>
    WISE<span>TECH</span> Admin
</h1>


<button
    class="refresh"
    onclick="loadOrders()"
>
    Refresh
</button>

</header>


<main>


<section class="stats">

    <div class="stat">

        <small>
            Paid Revenue
        </small>

        <strong id="revenue">
            GH₵0.00
        </strong>

    </div>


    <div class="stat">

        <small>
            Supplier Costs
        </small>

        <strong id="costs">
            GH₵0.00
        </strong>

    </div>


    <div class="stat">

        <small>
            Paystack Fees
        </small>

        <strong id="fees">
            GH₵0.00
        </strong>

    </div>


    <div class="stat profit">

        <small>
            Known Net Profit
        </small>

        <strong id="profit">
            GH₵0.00
        </strong>

    </div>

</section>


<div class="toolbar">

    <input
        id="search"
        placeholder=
        "Search customer, phone, product or reference..."
        oninput="renderOrders()"
    >


    <select
        id="paymentFilter"
        onchange="renderOrders()"
    >

        <option value="">
            All Payments
        </option>

        <option value="paid">
            Paid
        </option>

        <option value="pending">
            Pending
        </option>

    </select>


    <select
        id="fulfillmentFilter"
        onchange="renderOrders()"
    >

        <option value="">
            All Fulfillment
        </option>

        <option value="pending">
            Pending
        </option>

        <option value="processing">
            Processing
        </option>

        <option value="completed">
            Completed
        </option>

        <option value="cancelled">
            Cancelled
        </option>

    </select>

</div>


<div
    id="orders"
    class="orders"
>

    <div class="empty">
        Loading orders...
    </div>

</div>


</main>


<script>

let allOrders = [];


/* =========================================================
   LOAD
========================================================= */

async function loadOrders() {

    try {

        const response =
            await fetch(
                "/api/admin/orders"
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error();
        }


        allOrders =
            result.orders;


        updateStats();

        renderOrders();


    } catch {

        document
            .getElementById(
                "orders"
            )
            .innerHTML = `

                <div class="empty">

                    Unable to load orders.

                </div>

            `;
    }
}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    const paid =
        allOrders.filter(
            order =>
                order.payment_status ===
                "paid"
        );


    const revenue =
        paid.reduce(
            (total, order) =>
                total +
                Number(order.amount),
            0
        );


    /*
        Only count known supplier costs.
    */

    const costs =
        paid.reduce(
            (total, order) => {

                if (
                    order.supplier_cost ===
                    null
                ) {

                    return total;
                }


                return total +
                    Number(
                        order.supplier_cost
                    );
            },
            0
        );


    const fees =
        paid.reduce(
            (total, order) => {

                if (
                    order.paystack_fee ===
                    null
                ) {

                    return total;
                }


                return total +
                    Number(
                        order.paystack_fee
                    );
            },
            0
        );


    /*
        Profit only from orders where
        all values are known.
    */

    const profit =
        paid.reduce(
            (total, order) => {

                if (
                    order.net_profit ===
                    null
                ) {

                    return total;
                }


                return total +
                    Number(
                        order.net_profit
                    );
            },
            0
        );


    document
        .getElementById(
            "revenue"
        )
        .textContent =
            money(revenue);


    document
        .getElementById(
            "costs"
        )
        .textContent =
            money(costs);


    document
        .getElementById(
            "fees"
        )
        .textContent =
            money(fees);


    document
        .getElementById(
            "profit"
        )
        .textContent =
            money(profit);
}


/* =========================================================
   RENDER
========================================================= */

function renderOrders() {

    const container =
        document.getElementById(
            "orders"
        );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .trim()
            .toLowerCase();


    const payment =
        document
            .getElementById(
                "paymentFilter"
            )
            .value;


    const fulfillment =
        document
            .getElementById(
                "fulfillmentFilter"
            )
            .value;


    const filtered =
        allOrders.filter(
            order => {

                const searchable =
                    [
                        order.id,
                        order.customer_name,
                        order.phone,
                        order.email,
                        order.product,
                        order.payment_reference
                    ]
                    .join(" ")
                    .toLowerCase();


                return (

                    (
                        !search ||
                        searchable.includes(
                            search
                        )
                    ) &&

                    (
                        !payment ||
                        order.payment_status ===
                            payment
                    ) &&

                    (
                        !fulfillment ||
                        order.fulfillment_status ===
                            fulfillment
                    )

                );
            }
        );


    if (!filtered.length) {

        container.innerHTML = `

            <div class="empty">
                No orders found.
            </div>

        `;

        return;
    }


    container.innerHTML =
        filtered.map(
            order => {

                const paid =
                    order.payment_status ===
                    "paid";


                const costKnown =
                    order.supplier_cost !==
                    null;


                const feeKnown =
                    order.paystack_fee !==
                    null;


                const profitKnown =
                    order.net_profit !==
                    null;


                return `

                <article class="order">


                    <div class="top">

                        <div>

                            <div class="number">

                                ORDER #${order.id}

                            </div>


                            <div class="product">

                                ${escapeHtml(
                                    order.product
                                )}

                            </div>

                        </div>


                        <div class="amount">

                            ${money(
                                order.amount
                            )}

                        </div>

                    </div>


                    <div class="customer">


                        <div>

                            <small>
                                Customer
                            </small>

                            <strong>

                                ${escapeHtml(
                                    order.customer_name
                                )}

                            </strong>

                        </div>


                        <div>

                            <small>
                                Phone
                            </small>

                            <strong>

                                ${escapeHtml(
                                    order.phone
                                )}

                            </strong>

                        </div>


                        <div>

                            <small>
                                Email
                            </small>

                            <strong>

                                ${escapeHtml(
                                    order.email
                                )}

                            </strong>

                        </div>


                        <div>

                            <small>
                                Date
                            </small>

                            <strong>

                                ${formatDate(
                                    order.created_at
                                )}

                            </strong>

                        </div>


                    </div>


                    <div class="finance">


                        <div>

                            <small>
                                Customer Paid
                            </small>

                            <strong>

                                ${money(
                                    order.amount
                                )}

                            </strong>

                        </div>


                        <div>

                            <small>
                                Supplier Cost
                            </small>


                            <strong
                                class="
                                ${costKnown
                                    ? ""
                                    : "unknown"
                                }
                                "
                            >

                                ${costKnown
                                    ? money(
                                        order.supplier_cost
                                      )
                                    : "Not entered"
                                }

                            </strong>


                            <div class="cost-editor">

                                <input

                                    id="cost-${order.id}"

                                    type="number"

                                    min="0"

                                    step="0.01"

                                    value="${
                                        costKnown
                                        ? Number(
                                            order.supplier_cost
                                          ).toFixed(2)
                                        : ""
                                    }"

                                    placeholder="GH₵"

                                >


                                <button

                                    class="save-cost"

                                    onclick="
                                        saveSupplierCost(
                                            ${order.id}
                                        )
                                    "
                                >

                                    Save

                                </button>

                            </div>

                        </div>


                        <div>

                            <small>
                                Paystack Fee
                            </small>

                            <strong>

                                ${feeKnown
                                    ? money(
                                        order.paystack_fee
                                      )
                                    : "—"
                                }

                            </strong>

                        </div>


                        <div>

                            <small>
                                Net Profit
                            </small>

                            <strong
                                class="
                                ${profitKnown
                                    ? "net-profit"
                                    : "unknown"
                                }
                                "
                            >

                                ${profitKnown
                                    ? money(
                                        order.net_profit
                                      )
                                    : "Waiting for cost"
                                }

                            </strong>

                        </div>


                    </div>


                    <div class="status-row">


                        <div class="badges">


                            <span
                                class="
                                badge
                                ${paid
                                    ? "paid"
                                    : "pending"
                                }
                                "
                            >

                                PAYMENT:
                                ${escapeHtml(
                                    order.payment_status
                                )}

                            </span>


                            <span
                                class="
                                badge
                                ${escapeHtml(
                                    order.fulfillment_status
                                )}
                                "
                            >

                                ORDER:
                                ${escapeHtml(
                                    order.fulfillment_status
                                )}

                            </span>


                        </div>


                        <div class="actions">


                            <button
                                class="pending-btn"

                                onclick="
                                    changeFulfillment(
                                        ${order.id},
                                        'pending'
                                    )
                                "
                            >

                                Pending

                            </button>


                            <button
                                class="processing-btn"

                                ${!paid
                                    ? "disabled"
                                    : ""
                                }

                                onclick="
                                    changeFulfillment(
                                        ${order.id},
                                        'processing'
                                    )
                                "
                            >

                                Processing

                            </button>


                            <button
                                class="complete-btn"

                                ${!paid
                                    ? "disabled"
                                    : ""
                                }

                                onclick="
                                    changeFulfillment(
                                        ${order.id},
                                        'completed'
                                    )
                                "
                            >

                                ✓ Completed

                            </button>


                            <button
                                class="cancel-btn"

                                onclick="
                                    changeFulfillment(
                                        ${order.id},
                                        'cancelled'
                                    )
                                "
                            >

                                Cancel

                            </button>


                        </div>


                    </div>


                    <div class="reference">

                        Paystack Reference:

                        ${escapeHtml(
                            order.payment_reference ||
                            "-"
                        )}

                    </div>


                </article>

                `;

            }
        )
        .join("");
}


/* =========================================================
   SAVE SUPPLIER COST
========================================================= */

async function saveSupplierCost(
    orderId
) {

    const input =
        document.getElementById(
            `cost-${orderId}`
        );


    const supplierCost =
        Number(
            input.value
        );


    if (
        input.value.trim() === "" ||
        !Number.isFinite(
            supplierCost
        ) ||
        supplierCost < 0
    ) {

        alert(
            "Enter a valid supplier cost."
        );

        return;
    }


    try {

        const response =
            await fetch(

                `/api/admin/orders/${orderId}/supplier-cost`,

                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            supplierCost
                        })
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to save cost."
            );
        }


        await loadOrders();


    } catch (error) {

        alert(
            error.message
        );
    }
}


/* =========================================================
   FULFILLMENT
========================================================= */

async function changeFulfillment(
    orderId,
    status
) {

    if (
        !confirm(
            `Change order to ${status.toUpperCase()}?`
        )
    ) {

        return;
    }


    try {

        const response =
            await fetch(

                `/api/admin/orders/${orderId}/fulfillment`,

                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            status
                        })
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to update order."
            );
        }


        await loadOrders();


    } catch (error) {

        alert(
            error.message
        );
    }
}


/* =========================================================
   HELPERS
========================================================= */

function money(value) {

    return `GH₵${Number(
        value || 0
    ).toFixed(2)}`;
}


function escapeHtml(value) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );
}


function formatDate(value) {

    if (!value) {

        return "-";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(value);
    }


    return date
        .toLocaleString();
}


loadOrders();

</script>


</body>

</html>
