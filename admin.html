<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        WISETECH Admin Dashboard
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #070b12;

            color: #ffffff;

        }


        header {

            position: sticky;

            top: 0;

            z-index: 100;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 20px;

            padding:
                20px 5%;

            background:
                rgba(
                    5,
                    5,
                    5,
                    .96
                );

            border-bottom:
                1px solid #222;

        }


        header h1 {

            margin: 0;

            font-size: 23px;

        }


        header h1 span {

            color: #ffd000;

        }


        .refresh-button {

            border: 0;

            padding:
                11px 18px;

            border-radius:
                8px;

            background:
                #ffd000;

            color: #111;

            font-weight: 800;

            cursor: pointer;

        }


        main {

            max-width:
                1500px;

            margin: auto;

            padding:
                35px 5%;

        }


        /* ================================
           STATS
        ================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 16px;

            margin-bottom:
                30px;

        }


        .stat {

            padding:
                22px;

            background:
                linear-gradient(
                    145deg,
                    #121a28,
                    #080d14
                );

            border:
                1px solid #253247;

            border-radius:
                14px;

        }


        .stat small {

            display: block;

            margin-bottom:
                8px;

            color:
                #9ba8ba;

            font-size:
                12px;

        }


        .stat strong {

            font-size:
                27px;

            color:
                #ffd000;

        }


        /* ================================
           TOOLBAR
        ================================= */

        .toolbar {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom:
                20px;

        }


        input,
        select,
        button {

            font: inherit;

        }


        input,
        select {

            padding:
                11px 12px;

            border:
                1px solid #2b394e;

            border-radius:
                8px;

            background:
                #0b111c;

            color:
                #ffffff;

        }


        input {

            flex: 1;

            min-width:
                220px;

        }


        /* ================================
           ORDERS
        ================================= */

        .orders {

            display: grid;

            gap: 16px;

        }


        .order-card {

            padding:
                22px;

            background:
                linear-gradient(
                    145deg,
                    #101823,
                    #090e16
                );

            border:
                1px solid #263248;

            border-radius:
                15px;

        }


        .order-top {

            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            gap: 15px;

            margin-bottom:
                18px;

        }


        .order-number {

            color:
                #ffd000;

            font-size:
                13px;

            font-weight:
                900;

        }


        .order-product {

            margin-top:
                6px;

            font-size:
                19px;

            font-weight:
                800;

        }


        .order-amount {

            font-size:
                21px;

            font-weight:
                900;

            color:
                #ffd000;

            white-space:
                nowrap;

        }


        .order-info {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap: 15px;

            padding:
                15px 0;

            border-top:
                1px solid #202c3e;

            border-bottom:
                1px solid #202c3e;

        }


        .order-info small {

            display: block;

            margin-bottom:
                5px;

            color:
                #8090a5;

        }


        .order-info strong {

            font-size:
                13px;

            word-break:
                break-word;

        }


        /* ================================
           STATUS
        ================================= */

        .status-row {

            display: flex;

            align-items:
                center;

            justify-content:
                space-between;

            flex-wrap: wrap;

            gap: 15px;

            margin-top:
                18px;

        }


        .status-group {

            display: flex;

            gap: 10px;

            align-items:
                center;

            flex-wrap:
                wrap;

        }


        .status {

            display:
                inline-block;

            padding:
                7px 11px;

            border-radius:
                20px;

            font-size:
                10px;

            font-weight:
                900;

            text-transform:
                uppercase;

        }


        .paid {

            background:
                rgba(
                    38,
                    208,
                    124,
                    .15
                );

            color:
                #42e69a;

        }


        .payment-pending {

            background:
                rgba(
                    255,
                    208,
                    0,
                    .15
                );

            color:
                #ffd000;

        }


        .pending {

            background:
                rgba(
                    255,
                    208,
                    0,
                    .15
                );

            color:
                #ffd000;

        }


        .processing {

            background:
                rgba(
                    70,
                    160,
                    255,
                    .18
                );

            color:
                #66b4ff;

        }


        .completed {

            background:
                rgba(
                    40,
                    220,
                    140,
                    .18
                );

            color:
                #48e3a0;

        }


        .cancelled {

            background:
                rgba(
                    255,
                    70,
                    70,
                    .16
                );

            color:
                #ff7272;

        }


        /* ================================
           ACTION BUTTONS
        ================================= */

        .actions {

            display: flex;

            gap: 8px;

            flex-wrap:
                wrap;

        }


        .action {

            padding:
                8px 11px;

            border: 0;

            border-radius:
                7px;

            font-size:
                10px;

            font-weight:
                800;

            cursor: pointer;

        }


        .process-button {

            background:
                #2d8cff;

            color:
                white;

        }


        .complete-button {

            background:
                #27d17f;

            color:
                #07120d;

        }


        .reset-button {

            background:
                #ffd000;

            color:
                #111;

        }


        .cancel-button {

            background:
                #e63946;

            color:
                #fff;

        }


        .action:disabled {

            opacity:
                .35;

            cursor:
                not-allowed;

        }


        .reference {

            margin-top:
                13px;

            color:
                #77869b;

            font-size:
                10px;

            word-break:
                break-all;

        }


        .empty {

            padding:
                60px 20px;

            text-align:
                center;

            color:
                #8997aa;

            border:
                1px solid #263248;

            border-radius:
                15px;

        }


        /* ================================
           MOBILE
        ================================= */

        @media (
            max-width: 900px
        ) {

            .stats {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }


            .order-info {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }

        }


        @media (
            max-width: 600px
        ) {

            header {

                padding:
                    17px 15px;

            }


            header h1 {

                font-size:
                    19px;

            }


            main {

                padding:
                    25px 14px;

            }


            .stats {

                grid-template-columns:
                    1fr 1fr;

                gap: 10px;

            }


            .stat {

                padding:
                    16px;

            }


            .stat strong {

                font-size:
                    21px;

            }


            .order-card {

                padding:
                    17px;

            }


            .order-top {

                flex-direction:
                    column;

            }


            .order-info {

                grid-template-columns:
                    1fr;

            }


            .status-row {

                align-items:
                    flex-start;

            }


            .actions {

                width: 100%;

            }


            .action {

                flex: 1;

            }

        }

    </style>

</head>


<body>


<header>

    <h1>

        WISE<span>TECH</span>

        Admin

    </h1>


    <button
        class="refresh-button"
        onclick="loadOrders()"
    >

        Refresh

    </button>

</header>


<main>


    <!-- ========================
         STATS
    ========================= -->

    <section class="stats">


        <div class="stat">

            <small>
                Total Orders
            </small>

            <strong
                id="totalOrders"
            >
                0
            </strong>

        </div>


        <div class="stat">

            <small>
                Paid Orders
            </small>

            <strong
                id="paidOrders"
            >
                0
            </strong>

        </div>


        <div class="stat">

            <small>
                Completed
            </small>

            <strong
                id="completedOrders"
            >
                0
            </strong>

        </div>


        <div class="stat">

            <small>
                Paid Revenue
            </small>

            <strong
                id="revenue"
            >
                GH₵0.00
            </strong>

        </div>


    </section>


    <!-- ========================
         FILTERS
    ========================= -->

    <div class="toolbar">


        <input

            id="search"

            type="text"

            placeholder=
            "Search customer, phone, product or reference..."

            oninput=
            "renderOrders()"

        >


        <select
            id="paymentFilter"
            onchange="renderOrders()"
        >

            <option value="">
                All Payments
            </option>

            <option value="paid">
                Paid
            </option>

            <option value="pending">
                Pending Payment
            </option>

        </select>


        <select
            id="fulfillmentFilter"
            onchange="renderOrders()"
        >

            <option value="">
                All Fulfillment
            </option>

            <option value="pending">
                Pending
            </option>

            <option value="processing">
                Processing
            </option>

            <option value="completed">
                Completed
            </option>

            <option value="cancelled">
                Cancelled
            </option>

        </select>


    </div>


    <!-- ========================
         ORDERS
    ========================= -->

    <div
        id="orders"
        class="orders"
    >

        <div class="empty">
            Loading orders...
        </div>

    </div>


</main>


<script>


let allOrders = [];


/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders() {

    const container =
        document.getElementById(
            "orders"
        );


    container.innerHTML = `

        <div class="empty">
            Loading orders...
        </div>

    `;


    try {

        const response =
            await fetch(
                "/api/admin/orders"
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                "Unable to load orders."
            );

        }


        allOrders =
            result.orders;


        updateStats();

        renderOrders();


    } catch (error) {

        container.innerHTML = `

            <div class="empty">

                Unable to load orders.

            </div>

        `;

    }

}


/* =====================================
   STATS
===================================== */

function updateStats() {

    const paid =
        allOrders.filter(
            order =>
                order.payment_status ===
                "paid"
        );


    const completed =
        allOrders.filter(
            order =>
                order.fulfillment_status ===
                "completed"
        );


    const revenue =
        paid.reduce(
            (
                total,
                order
            ) =>

                total +
                Number(
                    order.amount
                ),

            0
        );


    document
        .getElementById(
            "totalOrders"
        )
        .textContent =
            allOrders.length;


    document
        .getElementById(
            "paidOrders"
        )
        .textContent =
            paid.length;


    document
        .getElementById(
            "completedOrders"
        )
        .textContent =
            completed.length;


    document
        .getElementById(
            "revenue"
        )
        .textContent =
            `GH₵${revenue.toFixed(2)}`;

}


/* =====================================
   RENDER
===================================== */

function renderOrders() {

    const container =
        document.getElementById(
            "orders"
        );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .trim()
            .toLowerCase();


    const paymentFilter =
        document
            .getElementById(
                "paymentFilter"
            )
            .value;


    const fulfillmentFilter =
        document
            .getElementById(
                "fulfillmentFilter"
            )
            .value;


    const filtered =
        allOrders.filter(
            order => {

                const searchable =
                    [

                        order.id,

                        order.customer_name,

                        order.phone,

                        order.email,

                        order.product,

                        order.payment_reference

                    ]
                    .join(" ")
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    searchable.includes(
                        search
                    );


                const matchesPayment =
                    !paymentFilter ||
                    order.payment_status ===
                        paymentFilter;


                const matchesFulfillment =
                    !fulfillmentFilter ||
                    order.fulfillment_status ===
                        fulfillmentFilter;


                return (

                    matchesSearch &&

                    matchesPayment &&

                    matchesFulfillment

                );

            }
        );


    if (
        filtered.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                No orders found.

            </div>

        `;

        return;

    }


    container.innerHTML =
        filtered.map(
            order => {

                const paymentClass =

                    order.payment_status ===
                        "paid"

                    ? "paid"

                    : "payment-pending";


                const fulfillment =
                    order.fulfillment_status ||
                    "pending";


                const paymentIsPaid =
                    order.payment_status ===
                    "paid";


                return `

                    <article class="order-card">


                        <div class="order-top">


                            <div>

                                <div class="order-number">

                                    ORDER #${order.id}

                                </div>


                                <div class="order-product">

                                    ${escapeHtml(
                                        order.product
                                    )}

                                </div>

                            </div>


                            <div class="order-amount">

                                GH₵${Number(
                                    order.amount
                                ).toFixed(2)}

                            </div>


                        </div>


                        <div class="order-info">


                            <div>

                                <small>
                                    Customer
                                </small>

                                <strong>

                                    ${escapeHtml(
                                        order.customer_name
                                    )}

                                </strong>

                            </div>


                            <div>

                                <small>
                                    Phone
                                </small>

                                <strong>

                                    ${escapeHtml(
                                        order.phone
                                    )}

                                </strong>

                            </div>


                            <div>

                                <small>
                                    Email
                                </small>

                                <strong>

                                    ${escapeHtml(
                                        order.email
                                    )}

                                </strong>

                            </div>


                            <div>

                                <small>
                                    Date
                                </small>

                                <strong>

                                    ${formatDate(
                                        order.created_at
                                    )}

                                </strong>

                            </div>


                        </div>


                        <div class="status-row">


                            <div class="status-group">


                                <span
                                    class="
                                    status
                                    ${paymentClass}
                                    "
                                >

                                    PAYMENT:
                                    ${escapeHtml(
                                        order.payment_status
                                    )}

                                </span>


                                <span
                                    class="
                                    status
                                    ${escapeHtml(
                                        fulfillment
                                    )}
                                    "
                                >

                                    ORDER:
                                    ${escapeHtml(
                                        fulfillment
                                    )}

                                </span>


                            </div>


                            <div class="actions">


                                <button

                                    class="
                                    action
                                    reset-button
                                    "

                                    onclick="
                                    changeFulfillment(
                                        ${order.id},
                                        'pending'
                                    )
                                    "
                                >

                                    Pending

                                </button>


                                <button

                                    class="
                                    action
                                    process-button
                                    "

                                    ${!paymentIsPaid
                                        ? "disabled"
                                        : ""
                                    }

                                    onclick="
                                    changeFulfillment(
                                        ${order.id},
                                        'processing'
                                    )
                                    "
                                >

                                    Processing

                                </button>


                                <button

                                    class="
                                    action
                                    complete-button
                                    "

                                    ${!paymentIsPaid
                                        ? "disabled"
                                        : ""
                                    }

                                    onclick="
                                    changeFulfillment(
                                        ${order.id},
                                        'completed'
                                    )
                                    "
                                >

                                    ✓ Completed

                                </button>


                                <button

                                    class="
                                    action
                                    cancel-button
                                    "

                                    onclick="
                                    changeFulfillment(
                                        ${order.id},
                                        'cancelled'
                                    )
                                    "
                                >

                                    Cancel

                                </button>


                            </div>


                        </div>


                        <div class="reference">

                            Paystack Reference:

                            ${escapeHtml(
                                order.payment_reference ||
                                "-"
                            )}

                        </div>


                    </article>

                `;

            }
        )
        .join("");

}


/* =====================================
   CHANGE FULFILLMENT
===================================== */

async function changeFulfillment(
    orderId,
    status
) {

    const friendly = {

        pending:
            "mark this order as pending",

        processing:
            "start processing this order",

        completed:
            "mark this order as completed",

        cancelled:
            "cancel this order"

    };


    const confirmed =
        confirm(
            `Are you sure you want to ${friendly[status]}?`
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(

                `/api/admin/orders/${orderId}/fulfillment`,

                {

                    method:
                        "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            status
                        })

                }

            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to update order."
            );

        }


        const existingIndex =
            allOrders.findIndex(
                order =>
                    Number(order.id) ===
                    Number(orderId)
            );


        if (
            existingIndex !== -1
        ) {

            allOrders[
                existingIndex
            ] =
                result.order;

        }


        updateStats();

        renderOrders();


    } catch (error) {

        alert(
            error.message ||
            "Unable to update order."
        );

    }

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(
    value
) {

    if (!value) {

        return "-";

    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(value);

    }


    return date
        .toLocaleString();

}


/* =====================================
   START
===================================== */

loadOrders();


</script>


</body>

</html>
